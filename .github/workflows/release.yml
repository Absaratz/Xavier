name: Release

# Fires when a version tag (e.g. v1.2.3) is pushed, independent of which
# branch it points at. Builds card_lan_app in release mode and publishes
# the APK + App Bundle as assets on a new GitHub Release named after the tag.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

defaults:
  run:
    working-directory: card_lan_app

jobs:
  build-android:
    name: Build Android release
    runs-on: ubuntu-latest
    env:
      # Job-level env is the standard way to gate a step's `if:` on a secret
      # (secrets can't be referenced directly in `if:`). True once the four
      # ANDROID_* secrets described in README.md#releasing have been added;
      # until then the build below falls back to debug signing.
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Configure release signing
        if: env.HAS_SIGNING == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=../upload-keystore.jks
          EOF

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-name=${{ steps.version.outputs.version }} \
            --build-number=${{ github.run_number }}

      - name: Build release App Bundle
        run: |
          flutter build appbundle --release \
            --build-name=${{ steps.version.outputs.version }} \
            --build-number=${{ github.run_number }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Card LAN ${{ steps.version.outputs.tag }}
          files: |
            card_lan_app/build/app/outputs/flutter-apk/app-release.apk
            card_lan_app/build/app/outputs/bundle/release/app-release.aab
